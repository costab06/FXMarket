[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fx-market"
version = "0.1.0"
requires-python = ">=3.12"
description = "FX market data aggregation, smart order routing, and HFF feature library"
dependencies = [
    # HTTP client (feeds + Dukascopy history)
    "httpx>=0.27",
    # Data
    "numpy>=1.26",
    "pandas>=2.0",
    # REST server
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    # Settings
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.4",
]
ib = [
    "ib_insync>=0.9",
]
fix = [
    "quickfix>=1.15",
]

[project.scripts]
fx-market = "fx_market.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fx_market"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
